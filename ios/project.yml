# Ouro iOS 앱(개발 11) — xcodegen 이 이 파일에서 Ouro.xcodeproj 를 만든다(scripts/build-ios.sh).
# 동기화 코어는 맥 헬퍼와 같은 Swift 패키지(../sync, OuroSyncKit)를 쓴다 — 폰은 헬퍼 없이 같은 엔진을 프로세스 안에서.
# 날짜 파서는 맥과 같은 러스트(../ouro-parse/swift, OuroParse — xcframework 는 scripts/build-parse.sh 가 만든다, 개발 14).
name: Ouro
options:
  bundleIdPrefix: com.dinggi5
  deploymentTarget:
    iOS: "26.0"
packages:
  OuroSyncKit:
    path: ../sync
  OuroParse:
    path: ../ouro-parse/swift
targets:
  Ouro:
    type: application
    platform: iOS
    # Shared = 앱과 위젯 확장이 같이 컴파일하는 인텐트(컨트롤 버튼이 거는 것).
    sources: [Ouro, Shared]
    dependencies:
      - package: OuroSyncKit
        product: OuroSyncKit
      - package: OuroParse
        product: OuroParse
      - target: OuroWidgets
    entitlements:
      path: Ouro/Ouro.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.dinggi5.ouro]
        aps-environment: development
        # 위젯 피드(widget.json)를 두는 곳 — 앱이 쓰고 위젯이 읽는다(개발 15).
        com.apple.security.application-groups: [group.com.dinggi5.ouro]
    info:
      path: Ouro/Info.plist
      properties:
        CFBundleDisplayName: Ouro
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 위젯을 누르면 그 항목을 연다(ouro://event/<id> · ouro://errand/<id>).
        CFBundleURLTypes:
          - CFBundleURLName: com.dinggi5.ouro.ios
            CFBundleURLSchemes: [ouro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinggi5.ouro.ios
        PRODUCT_NAME: Ouro
        # 빌드 번호 — TestFlight 는 올릴 때마다 커야 한다. scripts/upload-ios.sh 가 시각으로 덮어쓴다(앱·확장 같은 값).
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 74ZAMXKVXN
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        DEVELOPMENT_LANGUAGE: ko
        # Shared 의 인텐트가 앱 쪽에서만 화면을 건드리게.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) OURO_APP
  # 위젯 확장 — «빠른 추가» 컨트롤(개발 14) · 다음 일정·답 위젯(개발 15). 저장소는 안 열고 앱 그룹의 피드만 읽는다.
  OuroWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    entitlements:
      path: Widgets/OuroWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dinggi5.ouro]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ouro
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinggi5.ouro.ios.widgets
        PRODUCT_NAME: OuroWidgets
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 74ZAMXKVXN
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_LANGUAGE: ko
