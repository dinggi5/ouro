# Ouro iOS 앱(개발 11) — xcodegen 이 이 파일에서 Ouro.xcodeproj 를 만든다(scripts/build-ios.sh).
# 동기화 코어는 맥 헬퍼와 같은 Swift 패키지(../sync, OuroSyncKit)를 쓴다 — 폰은 헬퍼 없이 같은 엔진을 프로세스 안에서.
# 날짜 파서는 맥과 같은 러스트(../ouro-parse/swift, OuroParse — xcframework 는 scripts/build-parse.sh 가 만든다, 개발 14).
name: Ouro
options:
  bundleIdPrefix: com.dinggi5
  deploymentTarget:
    iOS: "26.0"
packages:
  OuroSyncKit:
    path: ../sync
  OuroParse:
    path: ../ouro-parse/swift
targets:
  Ouro:
    type: application
    platform: iOS
    # Shared = 앱과 위젯 확장이 같이 컴파일하는 인텐트(컨트롤 버튼이 거는 것).
    sources: [Ouro, Shared]
    dependencies:
      - package: OuroSyncKit
        product: OuroSyncKit
      - package: OuroParse
        product: OuroParse
      - target: OuroWidgets
    entitlements:
      path: Ouro/Ouro.entitlements
      properties:
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.dinggi5.ouro]
        aps-environment: development
    info:
      path: Ouro/Info.plist
      properties:
        CFBundleDisplayName: Ouro
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinggi5.ouro.ios
        PRODUCT_NAME: Ouro
        DEVELOPMENT_TEAM: 74ZAMXKVXN
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        DEVELOPMENT_LANGUAGE: ko
        # Shared 의 인텐트가 앱 쪽에서만 화면을 건드리게.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) OURO_APP
  # 위젯 확장(개발 14) — 지금은 «빠른 추가» 컨트롤 하나. 누르면 앱이 열리며 앱 쪽에서 인텐트가 돈다.
  OuroWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ouro
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinggi5.ouro.ios.widgets
        PRODUCT_NAME: OuroWidgets
        DEVELOPMENT_TEAM: 74ZAMXKVXN
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_LANGUAGE: ko
