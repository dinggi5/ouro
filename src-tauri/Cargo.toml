[package]
name = "ouro"
version = "0.1.1"
description = "선순환 캘린더 — 맥 메뉴바 캘린더 + AI 디스패처 + MCP"
authors = ["dinggi5"]
license = "MIT"
edition = "2021"

[lib]
# `_lib` 접미사 = 바이너리 이름과 겹치지 않게(Tauri 템플릿 관례, Windows 링크 충돌 회피).
name = "ouro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon = 메뉴바 상주, image-png = 트레이 아이콘을 PNG 로 싣기,
# macos-private-api = 투명 창(팝오버 둥근 모서리). App Store 에선 막히는 옵션이지만
# Ouro 는 DMG·brew 배포라 무관(PLAN §6, Kura 와 같은 길).
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde_json = "1"
# SQLite 를 앱에 묶어 넣는다(bundled) — 시스템 libsqlite3 버전에 따라 VACUUM INTO 등이 갈리지 않게.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 로컬 달력 날짜 계산(종일 일정·알림 9시·백업 이름). 시간대는 시스템 것을 쓴다.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# 일정을 만들 때의 IANA 시간대 이름을 적어 둔다(반복 전개 기준, v0.2).
iana-time-zone = "0.1.65"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
regex = "1"
# 부탁 프로세스 그룹을 통째로 멈춘다(디스패처 — 중단·시간 초과).
libc = "0.2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotification", "UNNotificationResponse", "UNNotificationSettings", "block2"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSBundle"] }
